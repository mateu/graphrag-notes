name: OpenClaw direct client

on:
  pull_request:
    paths:
      - 'clients/openclaw-fast-notes/**'
      - '.github/workflows/openclaw-client.yml'
  push:
    branches: [main]
    paths:
      - 'clients/openclaw-fast-notes/**'
      - '.github/workflows/openclaw-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    name: OpenClaw protocol and bounded lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/openclaw-fast-notes/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: clients/openclaw-fast-notes
      - run: npm test
        working-directory: clients/openclaw-fast-notes
