name: Versioned CLI releases

on:
  push:
    # Stable version tags build and publish the complete supported matrix.
    tags:
      - 'v*'
      # Candidates can publish a verified local asset without starting the
      # remaining platform builds. Dispatch a candidate explicitly when ready.
      - '!v*-*'
  workflow_dispatch:
    # After this workflow reaches the default branch, an existing candidate
    # tag can be dispatched to build the complete matrix without publishing.
    inputs:
      tag:
        description: Existing tag matching workspace.package.version (for example v0.1.0)
        required: true
        type: string
      publish:
        description: Publish the tagged stable/prerelease after all platform builds pass
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RUSTC_WRAPPER: ''
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: always
  # Avoid requiring Homebrew/OpenSSL shared libraries on the installed machine.
  OPENSSL_STATIC: '1'

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require an existing version tag matching every workspace package
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/package-release.py validate-source \
            --tag "$RELEASE_TAG" --expected-commit "$(git rev-parse HEAD)" \
            --require-tag --github-output "$GITHUB_OUTPUT"

  build:
    needs: validate
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev cmake pkg-config libssl-dev
      - name: Configure macOS build prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config openssl@3 llvm
          printf 'LIBCLANG_PATH=%s/lib\n' "$(brew --prefix llvm)" >> "$GITHUB_ENV"
          printf 'OPENSSL_DIR=%s\n' "$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          printf 'MACOSX_DEPLOYMENT_TARGET=15.0\n' >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Verify installer and source setup offline
        run: bash scripts/test-install.sh
      - name: Verify release packaging and provenance offline
        run: python3 scripts/test-release.py
      - name: Build locked CLI
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --locked --release -p graphrag-cli --bin graphrag --target "$BUILD_TARGET"
      - name: Seal exact native binary and check version, help, and runtime dependencies
        env:
          BUILD_TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          python3 scripts/package-release.py record-build \
            --tag "$RELEASE_TAG" --expected-commit "$RELEASE_COMMIT" \
            --target "$BUILD_TARGET" --binary "target/$BUILD_TARGET/release/graphrag" \
            --output "$RUNNER_TEMP/native-$BUILD_TARGET.json"
      - name: Package binary with starter notes
        env:
          BUILD_TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          python3 scripts/package-release.py package \
            --tag "$RELEASE_TAG" --expected-commit "$RELEASE_COMMIT" \
            --binary "target/$BUILD_TARGET/release/graphrag" \
            --build-record "$RUNNER_TEMP/native-$BUILD_TARGET.json" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  assemble:
    needs: [validate, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts
      - name: Verify complete native matrix and assemble checksums/provenance
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          python3 scripts/package-release.py assemble --input artifacts --output dist \
            --tag "$RELEASE_TAG" --targets aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.validate.outputs.tag }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [validate, assemble]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.validate.outputs.tag }}
          path: dist
      - name: Create release from verified version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes \
            --title "GraphRAG Notes $RELEASE_TAG" "${flags[@]}"
