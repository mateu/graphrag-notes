name: Rust quality gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Full unit/offline coverage is nightly; dependency advisories stay weekly.
    - cron: "23 3 * * *"
    - cron: "23 4 * * 1"

permissions:
  contents: read

# Superseded PR commits do not need to finish. Main is deliberately exempt so
# every pushed main commit retains a complete release-readiness record.
concurrency:
  group: rust-quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always

# Cargo caches: a GitHub cache key is immutable once saved, so jobs that build
# different artifacts must not share one. With a single shared key the fastest
# job (`cargo check`) saved first and every test lane rebuilt all dependencies
# despite a "full match". clippy/msrv share check-only artifacts; each test lane
# keeps its own key because `-p` selections unify features differently from
# `--workspace`. Only main saves, so PR caches cannot evict main's (10 GB repo
# limit); PRs still restore main's caches. Bump a key's -vN to reset it.

jobs:
  format:
    name: format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Verify installer and source setup offline
        run: bash scripts/test-install.sh
      - name: Verify release metadata and packaging offline
        run: python3 scripts/test-release.py
      - name: Reserve the review publisher check name
        run: python3 scripts/check-review-gate-name.py
      - name: Verify workflow evidence and isolation contracts offline
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check formatting (cargo fmt --all -- --check)
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint all workspace targets and features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  msrv:
    name: msrv (Rust 1.97.1)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Validate exact workspace MSRV declaration
        run: python3 scripts/check-workspace-rust-version.py
      - name: Check declared minimum supported Rust version
        run: cargo check --workspace --locked

  offline-integration:
    name: unit and offline integration
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '23 3 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: nextest-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run deterministic workspace tests (cargo nextest run --workspace --locked)
        # Only the fictional policy-migration fixture installs the safe
        # dedicated subscriber; nextest hides captured output on success.
        # Binaries run concurrently and the ci profile does not stop at the
        # first failure (see .config/nextest.toml).
        env:
          GRAPHRAG_MIGRATION_CONFLICT_PROBE: "1"
        run: cargo nextest run --workspace --locked --profile ci
      - name: Run doctests (nextest does not run them)
        run: cargo test --workspace --locked --doc
      - name: Validate the combined daily workflow with isolated provider doubles
        run: python3 scripts/validate-daily-workflow.py --binary target/debug/graphrag --offline

  persistent-round-trip:
    name: persistent DB, migrations, and data round trip
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: persistent-round-trip-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fresh migration fixture
        run: python3 scripts/run-exact-rust-test.py -p graphrag-db --lib --test-name migrations::tests::fresh_database_reaches_latest_schema_version
      - name: Upgrade migration fixture
        run: python3 scripts/run-exact-rust-test.py -p graphrag-db --lib --test-name migrations::tests::a_database_at_v001_can_upgrade_without_losing_data
      - name: Source idempotency fixture
        run: python3 scripts/run-exact-rust-test.py -p graphrag-db --lib --test-name repository::tests::source_lifecycle_is_idempotent_and_preserves_manual_notes
      - name: Resumable inference fault-injection fixture
        run: python3 scripts/run-exact-rust-test.py -p graphrag-agents --lib --test-name ingestion::librarian::tests::embedding_resume_persists_reconciliation_before_next_batch_cancellation
      - name: Portable backup and reindex round-trip fixture
        run: python3 scripts/run-exact-rust-test.py -p graphrag-cli --bin graphrag --test-name backup::tests::portable_backup_round_trip_is_streamed_verified_and_restorable

  retrieval-regression:
    name: retrieval regression baseline
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: retrieval-regression-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Indexed hot retrieval statement plans
        run: python3 scripts/run-exact-rust-test.py -p graphrag-db --lib --test-name repository::hot_retrieval_plan_tests::indexed_hot_retrieval_statements_keep_their_access_paths --nocapture
      - name: Entity and mentions plans with historical negative controls
        run: python3 scripts/run-exact-rust-test.py -p graphrag-db --lib --test-name repository::hot_retrieval_plan_tests::entity_lexeme_and_bound_mention_statements_reject_historical_scans --nocapture
      - name: Accepted edge frontier indexes in every direction
        run: python3 scripts/run-exact-rust-test.py -p graphrag-db --lib --test-name repository::edge_frontier_plan_tests::accepted_edge_frontiers_use_indexes_in_every_direction --nocapture
      - name: Accepted edge native ID and self-loop scan differential
        run: python3 scripts/run-exact-rust-test.py -p graphrag-db --lib --test-name repository::edge_frontier_plan_tests::indexed_edge_frontiers_match_scans_for_native_ids_and_self_loops
      - name: Accepted edge differential behavior
        run: python3 scripts/run-exact-rust-test.py -p graphrag-db --lib --test-name repository::graph_retrieval_batch_tests::edge_batches_preserve_pre_limit_filters_direction_confidence_cycles_and_sources
      - name: Provenance membership index and upgrade plans
        run: python3 scripts/run-exact-rust-test.py -p graphrag-db --lib --test-name repository::provenance_index_tests::provenance_membership_indexes_preserve_upgrade_and_fresh_results --nocapture
      - name: Exact-vector scan exception and filtered exactness
        run: python3 scripts/run-exact-rust-test.py -p graphrag-db --lib --test-name repository::exact_vector_plan_policy_tests::exact_vector_scan_exception_preserves_plans_and_filtered_top_k --nocapture
      - name: Compare deterministic fixture with tests/baselines/retrieval-v1.json
        run: python3 scripts/run-exact-rust-test.py -p graphrag-cli --bin graphrag --test-name eval::tests::committed_retrieval_fixture_matches_versioned_baseline --nocapture

  migration-regression:
    name: conditional migration and schema fixtures
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select migration changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/run-migration-gate.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: No migration changes
        if: steps.changes.outputs.selected != 'true'
        run: echo "Migration gate passed without Rust setup; no covered paths changed."
      - uses: dtolnay/rust-toolchain@1.97.1
        if: steps.changes.outputs.selected == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changes.outputs.selected == 'true'
        with:
          shared-key: migration-regression-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Migration, historical schema and portable schema fixtures
        if: steps.changes.outputs.selected == 'true'
        run: python3 scripts/run-migration-gate.py --run

  dependency-audit:
    name: scheduled dependency and security audit
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '23 4 * * 1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: audit-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: false
      # Prebuilt release binary instead of compiling cargo-audit (~2.5 min).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Verify scoped audit exemptions remain unreachable
        run: scripts/check-audit-exemptions.sh
      - name: Audit Cargo.lock (cargo audit)
        run: cargo audit
