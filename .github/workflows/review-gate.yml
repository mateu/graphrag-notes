name: Review gate evaluator
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  checks: write
  pull-requests: read
  issues: read
concurrency:
  group: review-gate-evaluator
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      # Never checkout a PR ref, including on pull_request_review events.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/review-gate.py
          sparse-checkout-cone-mode: false
      - run: python3 scripts/review-gate.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_GATE_FALLBACK_MINUTES: ${{ vars.REVIEW_GATE_FALLBACK_MINUTES }}
          REVIEW_GATE_ATTESTERS: ${{ vars.REVIEW_GATE_ATTESTERS }}
