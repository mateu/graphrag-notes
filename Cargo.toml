[workspace]
resolver = "2"
members = [
    "crates/config",
    "crates/core",
    "crates/db",
    "crates/agents",
    "crates/application",
    "crates/service",
    "crates/cli",
]

[workspace.package]
version = "0.1.0-rc.5"
edition = "2021"
rust-version = "1.97.1"
authors = ["Hunter"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"

# SurrealDB - minimal features in workspace, crates add what they need
surrealdb = { version = "3", default-features = false }
surrealdb-types = "3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
# Portable JSONL archives must recover the exact stored finite binary64 values.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
toml = "1.1"

# HTTP clients for inference services
reqwest = { version = "0.12", features = ["json"] }

# MCP transport and typed tool schemas
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "client", "macros", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest-mcp = { package = "reqwest", version = "0.13.2", default-features = false, features = ["rustls", "json"] }
axum = "0.8"
schemars = "1"
subtle = "2.6"
tokio-util = "0.7"
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["limit"] }
libc = "0.2"
url = "2"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
deunicode = "1.6"

# Testing
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"

[profile.dev]
# Optimize for compile speed during development/testing
codegen-units = 16
debug = 0
incremental = true
# Keep the default panic = "unwind": the test harness requires it, so
# "abort" here made cargo build every dependency twice for test runs.
# Strip symbols too: test binaries embed SurrealDB and RocksDB, and symbols
# were ~45% of their size. Backtraces lose function names; use
# CARGO_PROFILE_DEV_STRIP=debuginfo when one is needed.
strip = "symbols"

# Optimize third-party dependencies (SurrealDB, RocksDB's C++ via cc, vector
# math) while workspace crates stay at opt-level 0 for fast rebuilds. At -O0 the
# SurrealDB-heavy tests are CPU-bound in unoptimized dependency code: locally the
# graphrag-db suite (4 threads) dropped from 116s to 24s and the slowest fixture
# from 65s to 11s. opt-level 2 measured no faster than 1 but costs ~50% more
# dependency compile time, so 1 is the sweet spot. Applies to dev and test
# (test inherits dev); release is unaffected. See docs/ci-quality-gates.md.
[profile.dev.package."*"]
opt-level = 1

[profile.test]
# Test-specific profile inherits from dev but can be modified
inherits = "dev"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
