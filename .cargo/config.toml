# Repository Cargo configuration.
#
# sccache is optional: to use it, export RUSTC_WRAPPER=sccache or set
# `build.rustc-wrapper = "sccache"` in your user-level ~/.cargo/config.toml.
# It is not set here because a plain `cargo` command then fails on any
# machine without sccache installed.

[env]
# Debug async tests in this workspace build deep future chains; the default
# 2 MiB test-thread stack overflows. Give test threads headroom locally and in CI.
RUST_MIN_STACK = "16777216"
