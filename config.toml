# GraphRAG Notes Configuration

[database]
# Path to the local SurrealDB database. `~` is expanded.
path = "~/.graphrag/data-v3"

[inference]
# `tei` (default) or `ollama`.
embedding_provider = "tei"
# Embeddings endpoint (or the Ollama endpoint when embedding_provider = "ollama").
embedding_url = "http://localhost:8081"
embedding_model = "bge-m3:latest"
# `tgi` (default) or `ollama`.
extraction_provider = "tgi"
# Entity extraction endpoint (or the Ollama endpoint when extraction_provider = "ollama").
extraction_url = "http://localhost:8082"
extraction_model = "phi4-mini:latest"
# Shared Ollama fallback URL when either provider is Ollama.
ollama_url = "http://localhost:11434"
# Request timeout and maximum TEI batch size.
timeout_secs = 30
tei_max_batch = 32
# Provider-wide local processing controls. Attempts include the first request.
processing_concurrency = 4
retry_attempts = 3
retry_initial_backoff_ms = 250
retry_max_backoff_ms = 5000
cache_enabled = true
# Optional TEI prompt names. Leave commented to let the service defaults apply.
# tei_prompt_name_query = "query"
# tei_prompt_name_passage = "passage"
# Entity extraction controls. Invalid JSON is rejected at startup.
strict_entity_json = true
max_entities = 30
max_relationships = 15
ollama_timeout_secs = 120
# ollama_options = { temperature = 0, num_ctx = 1024 }

[search]
# Default number of results to return
default_limit = 10
# `rrf` combines independently ranked vector and full-text results without
# treating their raw distance/BM25 scores as a common scale. `weighted` exists
# only for controlled comparisons with the legacy behavior.
fusion_strategy = "rrf"
# RRF score = vector_weight / (rrf_k + vector_rank) +
#             fulltext_weight / (rrf_k + fulltext_rank)
rrf_k = 60
# Weights for vector vs full-text ranks; they must sum to 1.
vector_weight = 0.7
fulltext_weight = 0.3
# Candidate queries request clamp(limit * multiplier, min, max) rows from each
# retriever. The same value is used in the database KNN clause and SQL LIMIT.
candidate_pool_multiplier = 4
candidate_pool_min = 50
candidate_pool_max = 200
# Scope=all applies these weights after each hit type has been fused.
note_weight = 1.0
message_weight = 1.0
conversation_summary_weight = 1.0
# Bounded accepted-edge retrieval used by `search --graph=auto|on` and
# `augment --graph=auto|on`. Traversal is local-only: it never calls the
# extraction provider and never reads pending/rejected Gardener proposals.
graph_enabled = true
graph_max_seed_entities = 4
graph_max_seed_notes = 12
# Hard-limited by validation to two hops.
graph_max_hops = 1
graph_per_node_fanout = 8
graph_allowed_edge_types = ["supports", "contradicts", "derived_from", "related_to"]
graph_allow_outbound = true
graph_allow_inbound = true
graph_min_confidence = 0.0
graph_per_hop_decay = 0.8
graph_candidate_cap = 32
graph_seed_score = 0.03

[augment]
# Defaults for `augment` and `eval-augment` when their flags are omitted.
default_limit = 8
max_tokens = 1200
max_chunk_tokens = 180
# Diversity-aware packing uses `(1 - novelty_weight) * relevance + novelty_weight * novelty`.
# Candidates below `min_relevance` are never selected for diversity alone.
novelty_weight = 0.25
min_relevance = 0.0
near_duplicate_threshold = 0.85

[gardener]
# Minimum similarity score to suggest a connection
similarity_threshold = 0.7
# Auto-apply is disabled by default. When explicitly enabled, only persisted
# Gardener `related_to` proposals at or above this threshold may be accepted.
auto_apply_threshold = 0.85
auto_apply = false
# Maximum suggestions to generate per run
max_suggestions = 50

[librarian]
# Minimum chunk size (characters) when splitting documents
min_chunk_size = 50
# Target and hard maximum chunk sizes, measured in Unicode characters.
target_chunk_size = 700
max_chunk_size = 1000
# Tail characters copied into the next chunk when it fits the hard maximum.
chunk_overlap = 100
# Entity extraction/import controls. `extract_max_chars = 0` means no truncation.
skip_entity_extraction = false
extract_log_each = false
extract_max_chars = 8000
extract_progress_every = 10
extract_progress_every_secs = 5
import_progress_every = 10
import_progress_every_secs = 5

[logging]
# Log level: trace, debug, info, warn, error
level = "warn"
