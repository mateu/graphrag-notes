[package]
name = "graphrag-cli"
version.workspace = true
edition = "2021"
rust-version.workspace = true

[[bin]]
name = "graphrag"
path = "src/main.rs"

[dependencies]
graphrag-core = { path = "../core" }
graphrag-db = { path = "../db", features = ["rocksdb"] }
graphrag-agents = { path = "../agents" }
graphrag-application = { path = "../application" }
graphrag-config = { path = "../config" }
graphrag-service = { path = "../service" }

tokio.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy = "0.15"
sha2.workspace = true
chrono.workspace = true
tempfile.workspace = true
reqwest.workspace = true
uuid.workspace = true
rmcp.workspace = true
reqwest-mcp.workspace = true
rustyline = { version = "18.0.1", default-features = false }
libc.workspace = true

[dev-dependencies]
async-trait.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
chrono.workspace = true
