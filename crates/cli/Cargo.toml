[package]
name = "graphrag-cli"
version.workspace = true
edition = "2021"

[[bin]]
name = "graphrag"
path = "src/main.rs"

[dependencies]
graphrag-core = { path = "../core" }
graphrag-db = { path = "../db", features = ["rocksdb"] }
graphrag-agents = { path = "../agents" }
graphrag-config = { path = "../config" }

tokio.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy = "0.15"
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
