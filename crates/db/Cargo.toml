[package]
name = "graphrag-db"
version.workspace = true
edition = "2021"
rust-version.workspace = true

[features]
default = ["rocksdb"]
rocksdb = ["surrealdb/kv-rocksdb"]
# Opt-in allocator experiment; normal builds retain the platform allocator.
allocator = ["surrealdb/allocator"]

[dependencies]
graphrag-core = { path = "../core" }

surrealdb = { workspace = true, default-features = false, features = ["kv-mem"] }
surrealdb-types.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
sha2.workspace = true
uuid.workspace = true

[dev-dependencies]
ciborium = "0.2.2"
tempfile.workspace = true
