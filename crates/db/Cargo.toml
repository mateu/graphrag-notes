[package]
name = "graphrag-db"
version.workspace = true
edition = "2021"
rust-version.workspace = true

[features]
default = ["rocksdb"]
rocksdb = ["surrealdb/kv-rocksdb"]
# Shared historical-schema fixtures for this crate and downstream tests only.
test-support = []

[dependencies]
graphrag-core = { path = "../core" }

surrealdb = { workspace = true, default-features = false, features = ["kv-mem", "parse"] }
surrealdb-types.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
sha2.workspace = true
uuid.workspace = true
deunicode.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# fcntl(F_GETPATH) for wait_for_persistent_release.
libc.workspace = true

[dev-dependencies]
ciborium = "0.2.2"
tempfile.workspace = true
